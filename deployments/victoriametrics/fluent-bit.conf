[SERVICE]
    Flush         5
    Daemon        off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.path  /tmp/fluent-bit-storage/
    storage.sync  normal
    storage.checksum off
    storage.backlog.mem_limit 5M

# 采集应用程序日志文件
[INPUT]
    Name              tail
    Tag               apiserver.logs
    Path              /var/log/app.log
    Path_Key          filename
    Parser            json
    Multiline         Off
    Buffer_Chunk_Size 512k
    Buffer_Max_Size   2M
    Skip_Long_Lines   On
    Refresh_Interval  5
    storage.type      filesystem

# 采集 Docker 容器日志
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          filename
    Parser            docker_json
    Docker_Mode       On
    Docker_Mode_Flush 5
    Docker_Mode_Parser container_firstline
    Buffer_Chunk_Size 512k
    Buffer_Max_Size   2M
    Skip_Long_Lines   On
    Refresh_Interval  10
    storage.type      filesystem

# 接收来自应用程序的直接日志推送
[INPUT]
    Name              http
    Tag               apiserver.http
    Host              0.0.0.0
    Port              24224
    Buffer_Chunk_Size 512k
    Buffer_Max_Size   2M
    storage.type      filesystem

# 处理和过滤日志
[FILTER]
    Name                parser
    Match               apiserver.*
    Key_Name            log
    Parser              json
    Reserve_Data        On
    Preserve_Key        On

# 添加元数据标签
[FILTER]
    Name                modify
    Match               apiserver.*
    Add                 service apiserver
    Add                 environment development
    Add                 cluster apiserver-cluster
    Add                 version v2.0.0

# 重命名字段以符合 VictoriaLogs 要求
[FILTER]
    Name                modify
    Match               apiserver.*
    Rename              log _msg
    Rename              time _time

# 确保时间格式正确
[FILTER]
    Name                parser
    Match               apiserver.*
    Key_Name            _time
    Parser              timestamp
    Reserve_Data        On
    Preserve_Key        On

# 输出到 VictoriaLogs
[OUTPUT]
    Name                http
    Match               apiserver.*
    Host                victorialogs
    Port                9428
    URI                 /insert/jsonline
    Format              json_lines
    Header              Content-Type application/x-ndjson
    Retry_Limit         3
    storage.total_limit_size 10M

# 输出到标准输出 (调试用)
[OUTPUT]
    Name                stdout
    Match               apiserver.*
    Format              json_lines