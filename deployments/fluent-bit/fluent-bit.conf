# Fluent Bit 配置文件
# 用于收集应用日志并发送到 VictoriaLogs

[SERVICE]
    # Fluent Bit 服务配置
    Flush         1              # 日志刷新间隔（秒）
    Daemon        off            # 不以守护进程运行
    Log_Level     info           # 日志级别
    Parsers_File  parsers.conf   # 解析器配置文件
    HTTP_Server   On             # 启用HTTP监控端点
    HTTP_Listen   0.0.0.0        # HTTP监听地址
    HTTP_Port     2020           # HTTP监控端口

[INPUT]
    # 监控应用日志文件
    Name                tail
    Tag                 app.logs
    Path                /app/logs/*.log
    Path_Key           file_path
    Parser             json
    Read_from_Head     true
    Refresh_Interval   5
    Rotate_Wait        30
    Skip_Long_Lines    On
    Buffer_Chunk_Size  32k
    Buffer_Max_Size    256k
    Mem_Buf_Limit      5MB

[INPUT]
    # 监控应用错误日志文件  
    Name                tail
    Tag                 app.errors
    Path                /app/logs/error.log
    Path_Key           file_path
    Parser             json
    Read_from_Head     true
    Refresh_Interval   5
    Rotate_Wait        30
    Skip_Long_Lines    On
    Buffer_Chunk_Size  32k
    Buffer_Max_Size    256k
    Mem_Buf_Limit      5MB

[FILTER]
    # 为所有日志添加通用标签
    Name         modify
    Match        app.*
    Add          service_name apiserver
    Add          environment development  
    Add          version v2.0.0
    Add          host ${HOSTNAME}

[FILTER]
    # 解析和增强日志字段
    Name         parser
    Match        app.*
    Key_Name     message
    Parser       app_parser
    Reserve_Data On
    Preserve_Key On

[OUTPUT]
    # 发送到 VictoriaLogs
    Name          http
    Match         app.*
    Host          127.0.0.1
    Port          9428
    URI           /insert/jsonline
    Format        json_lines
    json_date_key timestamp
    json_date_format %Y-%m-%dT%H:%M:%S.%L
    Header        Content-Type application/x-ndjson
    Retry_Limit   3
    workers       1

[OUTPUT]
    # 备用输出到文件（可选）
    Name          file
    Match         app.*
    Path          /app/logs/backup
    File          app-backup.log
    Format        json_lines