# Fluent Bit 解析器配置文件
# 定义各种日志格式的解析规则

[PARSER]
    # JSON 格式解析器
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S.%L
    Time_Keep   On

[PARSER]
    # 应用自定义格式解析器
    Name        app_parser
    Format      regex
    Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(?<level>\w+)\s+(?<logger>[\w\/\.]+)\s+(?<message>.*)$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S.%L
    Time_Keep   On

[PARSER]
    # Kratos 日志格式解析器
    Name        kratos_parser
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%S%z
    Time_Keep   On

[PARSER]
    # 错误日志解析器（支持堆栈跟踪）
    Name        error_parser
    Format      regex
    Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(?<level>ERROR|FATAL|PANIC)\s+(?<logger>[\w\/\.]+)\s+(?<message>.*?)(?<stacktrace>(?:\n\s+at\s+.*)*)?$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S.%L
    Time_Keep   On

[PARSER]
    # 结构化日志解析器（keyvals格式）
    Name        structured_parser
    Format      regex
    Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(?<level>\w+)\s+(?<logger>[\w\/\.]+)\s+(?<message>[^{]*)\s*(?<fields>\{.*\})?$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S.%L
    Time_Keep   On