---
# Application Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    name: app
    purpose: application

---
# Application ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: apiserver-config
  namespace: app
  labels:
    app: apiserver
data:
  apiserver.yaml: |
    # HTTP 服务配置
    http:
      network: tcp
      addr: 0.0.0.0:8080
      timeout: 10s
    
    # gRPC 服务配置
    grpc:
      network: tcp
      addr: 0.0.0.0:9090
      timeout: 10s
    
    # 数据库配置
    mysql:
      host: mysql.database.svc.cluster.local
      database: protoc
      username: root
      password: "proj(#)666"
      log-level: 1
      enable-trace: true
    
    # Redis 配置
    redis:
      addr: "redis.database.svc.cluster.local:6379"
      password: ""
      database: 0
      enable-trace: true
    
    # JWT 配置
    jwt:
      key: "onex(#)666"
      expired: "2h"
      max-refresh: "2h"
      signing-method: "HS512"
    
    # Jaeger 追踪配置
    jaeger:
      enabled: true
      server: "jaeger.logging.svc.cluster.local:6831"
      service-name: "apiserver"
      env: "production"
      sampler-type: "const"
      sampler-param: 1.0
      reporter-log-spans: true
    
    # 日志配置
    log:
      type: "zap"
      level: "info"
      format: "json"
      disable-caller: false
      disable-stacktrace: false
      output-paths: ["stdout"]
      error-output-paths: ["stderr"]
      
      # OTLP 配置
      otlp:
        enabled: true
        endpoint: "otelcol.logging.svc.cluster.local:4317"
        insecure: true
        timeout: 10s
        batch_size: 100
        export_timeout: 30s
        resource_attributes:
          service.name: "apiserver"
          service.version: "v2.0.0"
          service.namespace: "go-protoc"
          deployment.environment: "production"
      
      # 初始字段
      initial-fields:
        service: "apiserver"
        version: "v2.0.0"
        environment: "production"

---
# Application Secret
apiVersion: v1
kind: Secret
metadata:
  name: apiserver-secret
  namespace: app
  labels:
    app: apiserver
type: Opaque
data:
  mysql-password: cHJvaigjKTY2Ng==  # base64: proj(#)666
  jwt-key: b25leCgjKTY2Ng==         # base64: onex(#)666

---
# Application Service
apiVersion: v1
kind: Service
metadata:
  name: apiserver
  namespace: app
  labels:
    app: apiserver
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: apiserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP

---
# Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
  namespace: app
  labels:
    app: apiserver
    version: v2.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: apiserver
  template:
    metadata:
      labels:
        app: apiserver
        version: v2.0.0
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        # 日志收集注解
        fluentbit.io/parser: json
        fluentbit.io/exclude: "false"
    spec:
      containers:
        - name: apiserver
          image: your-registry/apiserver:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          env:
            # Kubernetes 环境变量
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            
            # OpenTelemetry 配置
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol.logging.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "apiserver"
            - name: OTEL_SERVICE_VERSION
              value: "v2.0.0"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),deployment.environment=production"
            
            # 应用配置
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: APP_ENV
              value: "production"
            
            # 从 Secret 读取敏感配置
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apiserver-secret
                  key: mysql-password
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: apiserver-secret
                  key: jwt-key
          
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: tmp
              mountPath: /tmp
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          
          # 健康检查
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # 启动探针
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      
      volumes:
        - name: config
          configMap:
            name: apiserver-config
            defaultMode: 0644
        - name: tmp
          emptyDir: {}
      
      # 服务账户
      serviceAccountName: default
      
      # 安全上下文
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      
      # DNS 配置
      dnsPolicy: ClusterFirst
      
      # 重启策略
      restartPolicy: Always
      
      # 终止宽限期
      terminationGracePeriodSeconds: 30
      
      # 亲和性规则
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - apiserver
                topologyKey: kubernetes.io/hostname

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apiserver-hpa
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apiserver
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apiserver-pdb
  namespace: app
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: apiserver