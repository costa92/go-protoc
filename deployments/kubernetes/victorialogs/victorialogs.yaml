---
# VictoriaLogs PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victorialogs-pvc
  namespace: logging
  labels:
    app: victorialogs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd  # 根据集群调整

---
# VictoriaLogs Service
apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: logging
  labels:
    app: victorialogs
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb  # AWS 特定
spec:
  selector:
    app: victorialogs
  ports:
    - name: http
      port: 9428
      targetPort: 9428
      protocol: TCP
  type: ClusterIP

---
# VictoriaLogs Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
  namespace: logging
  labels:
    app: victorialogs
    version: v1.28.0
spec:
  replicas: 1
  strategy:
    type: Recreate  # 由于 PVC 只支持 ReadWriteOnce
  selector:
    matchLabels:
      app: victorialogs
  template:
    metadata:
      labels:
        app: victorialogs
        version: v1.28.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9428"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.28.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9428
              protocol: TCP
          args:
            - -storageDataPath=/victorialogs-data
            - -httpListenAddr=:9428
            - -retentionPeriod=30d
            - -memory.allowedPercent=80
            - -loggerLevel=INFO
            - -loggerFormat=json
          env:
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: storage
              mountPath: /victorialogs-data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: victorialogs-pvc
      securityContext:
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - victorialogs
                topologyKey: kubernetes.io/hostname

---
# VictoriaLogs HorizontalPodAutoscaler (可选)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: victorialogs-hpa
  namespace: logging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: victorialogs
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60