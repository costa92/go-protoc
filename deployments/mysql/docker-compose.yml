version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: go-protoc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: proj(#)666
      MYSQL_DATABASE: onex
      MYSQL_USER: appuser
      MYSQL_PASSWORD: proj(#)666
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - go-protoc-network

volumes:
  mysql_data:
    name: go-protoc-mysql-data

networks:
  go-protoc-network:
    name: go-protoc-network
    driver: bridge