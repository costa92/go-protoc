services:
  mongodb:
    image: mongo:${MONGODB_VERSION:-7.0.5}
    container_name: proj-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=proj(#)666
      - MONGO_INITDB_DATABASE=onex
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - proj
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 10s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  proj:
    external: true