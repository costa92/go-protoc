http:
  network: tcp
  addr: 0.0.0.0:8080
  timeout: 10s

grpc:
  network: tcp
  addr: 0.0.0.0:9090
  timeout: 10s

mysql:
  host: 127.0.0.1 # 数据库主机地址
  database: protoc # 数据库名称
  username: root # 数据库用户名
  password: proj(#)666 # 数据库密码
  log-level: 1 # 数据库日志级别，1 为最低，4 为最高
  enable-trace: true # 启用 OpenTelemetry 追踪

redis:
  addr: "127.0.0.1:6379" # Redis 服务器地址
  password: "" # Redis 密码（如果没有则留空）
  database: 0 # Redis 数据库编号
  enable-trace: true # 启用 OpenTelemetry 追踪

jwt:
  key: "onex(#)666" # IMPORTANT: Change this in production to a strong, random key (6-32 chars)!
  expired: "2h"
  max-refresh: "2h"
  signing-method: "HS512"

# Jaeger OpenTelemetry Tracing Configuration
jaeger:
  enabled: true # 是否启用 Jaeger 追踪功能（默认关闭，需要显式开启）
  server: "127.0.0.1:6831" # Jaeger Agent UDP端点 (6831是Agent UDP端口)
  service-name: "apiserver" # 服务名称，在Jaeger UI中显示
  env: "development" # 环境标识：development, staging, production
  sampler-type: "const" # 采样策略：const(固定), probabilistic(概率), rateLimiting(限流)
  sampler-param: 1.0 # 采样参数：const时为0或1，probabilistic时为0.0-1.0的概率值
  reporter-log-spans: true # 是否在日志中记录span信息
  agent-host: "127.0.0.1" # Jaeger Agent主机地址（如果使用UDP）
  agent-port: 6831 # Jaeger Agent端口（如果使用UDP）

# Enhanced Logger Configuration (pkg/logger)
log:
  type: "zap" # 日志器类型: zap 或 slog
  dynamic: false # 启用动态配置功能（运行时调整日志配置）
  level: "debug" # 日志级别: debug, info, warn, error, fatal
  format: "json" # 日志格式: json, text, console
  disable-caller: false # 是否禁用调用者信息
  disable-stacktrace: false # 是否禁用堆栈跟踪
  enable-color: false # 启用控制台颜色输出（JSON格式不需要）
  output-paths: ["stdout", "logs/app.log"] # 日志输出路径
  error-output-paths: ["stderr"] # 错误日志输出路径
  development: false # 开发模式（更详细的日志输出）
  encoding: "json" # 编码格式: json, console
  max-size: 100 # 日志文件最大大小（MB）
  max-age: 7 # 日志文件最大保留天数
  max-backups: 5 # 最大备份文件数量
  compress: true # 压缩旧日志文件
  caller-skip: 1 # 调用者跳过的堆栈帧数
  disable-function-at-info: true # 在info级别日志中禁用函数名显示
  
  # 编码器配置
  encoder-config:
    time-key: "ts" # 时间字段键名
    level-key: "level" # 级别字段键名
    message-key: "msg" # 消息字段键名
    caller-key: "caller" # 调用者字段键名
    stacktrace-key: "stacktrace" # 堆栈跟踪字段键名
    function-key: "func" # 函数名字段键名
    time-encoder: "iso8601" # 时间编码格式
    level-encoder: "lowercase" # 级别编码格式
    caller-encoder: "short" # 调用者编码格式
  
  # 初始字段（添加到所有日志条目）
  initial-fields:
    service: "apiserver"
    version: "v2.0.0"
    environment: "development"