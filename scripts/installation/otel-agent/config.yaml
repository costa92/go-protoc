# OTEL Agent Configuration for Native Installation
# This configuration is optimized for sidecar deployment alongside applications
# Agent receives telemetry data from applications and forwards to OTEL Collector

receivers:
  # OTLP receivers for application telemetry data
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317               # Standard OTLP gRPC port
      http:
        endpoint: 0.0.0.0:4318               # Standard OTLP HTTP port

  # Lightweight file monitoring for local application logs
  filelog:
    include:
      - /var/log/app/app.log                 # Application log file
      - /var/log/apiserver/app.log           # API server log file
    exclude:
      - /var/log/otel-agent-*                # Exclude Agent self-logs
      
    start_at: end                            # Start from end for production
    include_file_name: true
    include_file_path: true
    
    # Lightweight monitoring configuration
    poll_interval: 500ms                     # Standard polling for agent
    max_concurrent_files: 128                # Smaller limit for agent
    encoding: utf-8

    operators:
      - type: json_parser
        id: parse_json
        parse_from: body
        parse_to: attributes
      # Add agent identifier
      - type: add
        field: attributes.otel_component
        value: agent

processors:
  # Lightweight batch processing
  batch:
    timeout: 200ms                           # Faster forwarding to collector
    send_batch_size: 100                     # Smaller batches
    send_batch_max_size: 200

  # Resource attributes for agent identification
  resource:
    attributes:
      - key: deployment.environment
        value: "${PROJ_ENVIRONMENT}"
        action: upsert
      - key: service.namespace
        value: "${PROJ_SERVICE_NAMESPACE}" 
        action: upsert
      - key: deployment.type
        value: "native"
        action: upsert
      - key: otel.component
        value: "agent"
        action: upsert
      - key: agent.version
        value: "${PROJ_OTEL_VERSION}"
        action: upsert

  # Memory limiter for lightweight agent
  memory_limiter:
    check_interval: 1s
    limit_mib: 128                           # Smaller limit for agent

exporters:
  # Forward to OTEL Collector (main export destination)
  otlp/collector:
    endpoint: "127.0.0.1:4317"               # OTEL Collector gRPC endpoint
    tls:
      insecure: true
    compression: gzip
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 2m

  # Optional: Local backup for critical data
  file:
    path: "/var/log/otel-agent/backup.json"
    rotation:
      max_megabytes: 10                      # Very small files for agent
      max_days: 1

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  
  pipelines:
    # Logs pipeline - forward all logs to collector
    logs:
      receivers: [filelog, otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/collector]

    # Metrics pipeline - forward all metrics to collector
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]  
      exporters: [otlp/collector]

    # Traces pipeline - forward all traces to collector
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/collector]

  # Agent telemetry configuration (lightweight)
  telemetry:
    logs:
      level: warn                            # Less verbose for agent
      development: false
      sampling:
        initial: 2
        thereafter: 100
    metrics:
      level: basic