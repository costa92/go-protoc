# OpenTelemetry Collector Configuration with VictoriaLogs Integration
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327
      http:
        endpoint: 0.0.0.0:4328

  # File log receiver for application logs
  filelog:
    include:
      - /app/logs/app.log
    start_at: end  # Only read new logs to avoid duplicates
    operators:
      # Parse JSON logs
      - type: json_parser
        id: json_parser
        if: 'body matches "^\\{"'
      # Move log level to severity
      - type: severity_parser
        id: severity_parser
        parse_from: attributes.level
        mapping:
          debug: debug
          info: info
          warn: warn
          warning: warn
          error: error
          fatal: fatal

processors:
  batch:
    timeout: 10s
    send_batch_size: 100

  memory_limiter:
    limit_mib: 512
    check_interval: 5s

  resource:
    attributes:
      - key: service.name
        value: "apiserver"
        action: upsert
      - key: service.version
        value: "v2.0.0"
        action: upsert
      - key: deployment.environment
        value: "development"
        action: upsert

  # Transform logs for better VictoriaLogs compatibility
  transform:
    log_statements:
      - context: log
        statements:
          # Ensure required fields exist
          - set(attributes["service.name"], "apiserver") where attributes["service.name"] == nil
          - set(attributes["level"], "info") where attributes["level"] == nil
          # Add timestamp for VictoriaLogs
          - set(attributes["_time"], time_unix_nano / 1000000000)
          # Create labels for VictoriaLogs filtering
          - set(attributes["job"], "apiserver")
          - set(attributes["instance"], "localhost")

exporters:
  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200

  # VictoriaLogs via Loki-compatible API
  loki/victorialogs:
    endpoint: http://proj-victorialogs:9428/insert/loki/api/v1/push
    tls:
      insecure: true
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 5m
    # Static labels for all logs
    labels:
      service: "apiserver"
      environment: "development"
      collector: "otelcol"
    # Dynamic labels from log attributes
    labels_attributes:
      level: "level"
      caller: "caller"

  # File backup
  file:
    path: /app/logs/otelcol-output.json

service:
  extensions: [health_check]
  
  pipelines:
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [debug, loki/victorialogs, file]

  telemetry:
    logs:
      level: info

extensions:
  health_check:
    endpoint: 0.0.0.0:13133