# Simplified OpenTelemetry Collector Configuration - File only for now
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327
      http:
        endpoint: 0.0.0.0:4328

  # File log receiver for application logs
  filelog:
    include:
      - /app/logs/app.log
    start_at: end  # Only read new logs to avoid duplicates
    operators:
      # Parse JSON logs
      - type: json_parser
        id: json_parser
        if: 'body matches "^\\{"'
      # Move log level to severity
      - type: severity_parser
        id: severity_parser
        parse_from: attributes.level
        mapping:
          debug: debug
          info: info
          warn: warn
          warning: warn
          error: error
          fatal: fatal

processors:
  batch:
    timeout: 5s
    send_batch_size: 50

  memory_limiter:
    limit_mib: 512
    check_interval: 5s

  resource:
    attributes:
      - key: service.name
        value: "apiserver"
        action: upsert

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 100

  # File output for logs (for now)
  file:
    path: /app/logs/otelcol-processed.json

service:
  extensions: [health_check]
  
  pipelines:
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, file]

  telemetry:
    logs:
      level: info

extensions:
  health_check:
    endpoint: 0.0.0.0:13133