# OpenTelemetry Collector Configuration for Native/Host Installation
# This configuration is designed for running on the host system directly

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:${PROJ_OTELCOL_GRPC_PORT}
      http:
        endpoint: 0.0.0.0:${PROJ_OTELCOL_HTTP_PORT}

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otelcol'
          scrape_interval: 10s
          static_configs:
            - targets: ['localhost:8888']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    limit_mib: 512
    check_interval: 1s

exporters:
  logging:
    verbosity: detailed

  prometheus:
    endpoint: "0.0.0.0:8889"

  # Use OTLP exporter for traces (compatible with Jaeger)
  otlp/jaeger:
    endpoint: http://${PROJ_OTELCOL_HOST}:14268/api/traces
    tls:
      insecure: true
    # Connection timeout and retry settings
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

  # Optional: Add file exporter for logs
  file:
    path: /var/log/otelcol/otelcol-output.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging, otlp/jaeger]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [logging, prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging, file]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: 0.0.0.0:${PROJ_OTELCOL_HEALTH_PORT}