# OpenTelemetry Collector Configuration for Docker Installation with File Monitoring
# This configuration adds file log monitoring capability for host log files

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327
      http:
        endpoint: 0.0.0.0:4328

  # File log receiver for monitoring application log files
  filelog:
    include:
      - /host/logs/**/*.log
      - /host/logs/**/*.json
    exclude:
      - /host/logs/otelcol-*
    operators:
      # Parse JSON logs if they are in JSON format
      - type: json_parser
        if: 'body matches "^\\{.*\\}$"'
        parse_from: body
        parse_to: attributes
      # Add metadata to file-based logs
      - type: add
        field: attributes.log_source
        value: "file"
      - type: add
        field: attributes.collector
        value: "otelcol"

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otelcol'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    limit_mib: 512
    check_interval: 1s

  # Add resource attributes to distinguish between sources
  resource:
    attributes:
      - key: service.name
        value: "${PROJ_SERVICE_NAME}"
        action: upsert
      - key: service.version
        value: "${PROJ_SERVICE_VERSION}"
        action: upsert
      - key: deployment.environment
        value: "${PROJ_ENVIRONMENT}"
        action: upsert

exporters:
  logging:
    verbosity: detailed

  prometheus:
    endpoint: "0.0.0.0:8889"

  # Use OTLP exporter for traces (compatible with Jaeger)
  otlp/jaeger:
    endpoint: http://jaeger:14268/api/traces
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 60s
      max_elapsed_time: 10m

  # VictoriaLogs log exporter with enhanced configuration
  loki/victorialogs:
    endpoint: http://proj-victorialogs:9428/insert/loki/api/v1/push
    tls:
      insecure: true
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m


service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging, otlp/jaeger]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [logging, prometheus]

    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resource, batch]
      exporters: [logging, loki/victorialogs]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133