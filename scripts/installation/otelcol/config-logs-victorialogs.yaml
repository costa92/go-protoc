# OpenTelemetry Collector Configuration for VictoriaLogs Integration
# Optimized for log collection and forwarding to VictoriaLogs

receivers:
  # OTLP receiver for applications sending logs via OpenTelemetry
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327
      http:
        endpoint: 0.0.0.0:4328

  # File receiver to tail log files from applications
  filelog:
    include: 
      - /app/logs/app/*.log
      - /app/logs/apiserver/*.log
      - /app/logs/app.log
    start_at: end
    operators:
      # Parse JSON logs
      - type: json_parser
        id: json_parser
        if: 'body matches "^\\{"'
      # Move log level to severity
      - type: severity_parser
        id: severity_parser
        parse_from: attributes.level
        mapping:
          debug: debug
          info: info
          warn: warn
          warning: warn
          error: error
          fatal: fatal

processors:
  # Memory limiter to prevent OOM
  memory_limiter:
    limit_mib: 1024
    check_interval: 5s
    spike_limit_mib: 256

  # Batch processor for efficient forwarding
  batch:
    timeout: 10s
    send_batch_size: 512
    send_batch_max_size: 1024

  # Resource processor to add service metadata
  resource:
    attributes:
      - key: service.name
        value: "otelcol-logs"
        action: upsert
      - key: service.version
        value: "1.0.0"
        action: upsert
      - key: deployment.environment
        from_attribute: environment
        action: upsert

  # Transform logs for VictoriaLogs compatibility
  transform:
    log_statements:
      - context: log
        statements:
          # Ensure required fields exist
          - set(attributes["service"], "unknown") where attributes["service"] == nil
          - set(attributes["level"], "info") where attributes["level"] == nil
          # Convert timestamp to RFC3339 format
          - set(attributes["@timestamp"], time_unix_nano / 1000000000)
          # Create structured labels for VictoriaLogs
          - set(attributes["job"], attributes["service"])
          - set(attributes["instance"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
          - set(attributes["instance"], "unknown") where resource.attributes["host.name"] == nil

exporters:
  # Debug exporter
  debug:
    verbosity: detailed
    sampling_initial: 2
    sampling_thereafter: 500

  # VictoriaLogs via HTTP (JSON Lines format)
  otlphttp/victorialogs:
    logs_endpoint: http://proj-victorialogs:9428/insert/jsonline
    tls:
      insecure: true
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m

  # File backup for debugging
  file:
    path: /app/logs/otelcol/processed-logs.json
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3

  # Prometheus metrics for monitoring log processing
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otelcol_logs
    const_labels:
      collector: victorialogs

service:
  # Extensions
  extensions: [health_check, pprof, zpages]

  # Log processing pipeline
  pipelines:
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [debug, otlphttp/victorialogs, file]

  # Enable telemetry
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

extensions:
  # Health check endpoint
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance profiling
  pprof:
    endpoint: 0.0.0.0:1777

  # Internal telemetry
  zpages:
    endpoint: 0.0.0.0:55679