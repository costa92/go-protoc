# Simple Log Collection Configuration - File monitoring only
---
receivers:
  # File Log Receiver - 监控应用程序日志文件
  filelog/apiserver:
    include:
      - /app/logs/apiserver/*.log
      - /app/logs/*.log
      - /app/api_startup*.log
    start_at: end  # 只读取新增的日志条目，避免重复
    operators:
      # 解析JSON格式的日志
      - type: json_parser
        id: json_parser
        if: 'body matches "^\\{"'
        timestamp:
          parse_from: attributes.timestamp
          layout: '%Y-%m-%d %H:%M:%S.%f'
      # 解析日志级别
      - type: severity_parser
        id: severity_parser
        parse_from: attributes.level
        mapping:
          debug: debug
          info: info
          warn: warn
          warning: warn
          error: error
          fatal: fatal

processors:
  # 批量处理器 - 提高发送效率
  batch:
    timeout: 5s
    send_batch_size: 100

  # 内存限制器 - 防止内存溢出
  memory_limiter:
    limit_mib: 256
    check_interval: 5s

  # 资源处理器 - 添加服务信息
  resource:
    attributes:
      - key: service.name
        value: "apiserver"
        action: upsert
      - key: service.version
        value: "v2.0.0"
        action: upsert
      - key: deployment.environment
        value: "development"
        action: upsert
      - key: service.namespace
        value: "go-protoc"
        action: upsert

  # 日志转换处理器
  transform:
    log_statements:
      - context: log
        statements:
          - set(attributes["service.name"], "apiserver") where attributes["service.name"] == nil
          - set(attributes["level"], "info") where attributes["level"] == nil
          - set(attributes["_time"], time_unix_nano)
          - set(attributes["job"], "apiserver")
          - set(attributes["instance"], "localhost:8080")

exporters:
  # Debug输出
  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 100

  # File Export - 处理后的日志输出到文件
  file/processed:
    path: /app/logs/otelcol-processed.json

  # File Export - 格式化输出供VictoriaLogs消费
  file/victorialogs:
    path: /app/logs/otelcol-victorialogs.json
    format: json

service:
  pipelines:
    logs:
      receivers: [filelog/apiserver]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [debug, file/processed, file/victorialogs]

  extensions: [health_check]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8891

extensions:
  health_check:
    endpoint: 0.0.0.0:13136
    path: "/health"