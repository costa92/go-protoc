# Simplified OpenTelemetry Collector Configuration for VictoriaLogs
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327
      http:
        endpoint: 0.0.0.0:4328

  # File log receiver for application logs
  filelog:
    include:
      - /app/logs/app.log
    start_at: beginning
    operators:
      # Parse JSON logs
      - type: json_parser
        id: json_parser
        if: 'body matches "^\\{"'
      # Move log level to severity
      - type: severity_parser
        id: severity_parser
        parse_from: attributes.level
        mapping:
          debug: debug
          info: info
          warn: warn
          warning: warn
          error: error
          fatal: fatal

processors:
  batch:
    timeout: 10s
    send_batch_size: 512

  memory_limiter:
    limit_mib: 512
    check_interval: 5s

  resource:
    attributes:
      - key: service.name
        value: "otelcol-logs"
        action: upsert

exporters:
  debug:
    verbosity: detailed
    sampling_initial: 2
    sampling_thereafter: 100

  # 使用 HTTP exporter 发送到 VictoriaLogs
  otlphttp/victorialogs:
    logs_endpoint: http://proj-victorialogs:9428/insert/jsonline
    tls:
      insecure: true
    timeout: 30s

  # 文件备份
  file:
    path: /app/logs/otelcol-output.json

service:
  extensions: [health_check]
  
  pipelines:
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, file]
      # Note: VictoriaLogs integration via otlphttp/victorialogs exporter
      # Currently disabled for testing file output first

  telemetry:
    logs:
      level: info

extensions:
  health_check:
    endpoint: 0.0.0.0:13133