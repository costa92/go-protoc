receivers:
  filelog:
    include:
      - /host/logs/**/*.log              # 宿主机日志文件模式（通过卷挂载）
      - /host/logs/**/*.json             # JSON 格式日志文件
      - /host/logs/apiserver/app.log     # 特定应用日志文件
    exclude:
      - /host/logs/otelcol-*             # 排除 collector 自身日志
      - /host/logs/**/*test*             # 排除测试日志文件

    start_at: end                        # 生产建议用 end，避免重放历史日志
    include_file_name: false
    include_file_path: false

    # 文件监控配置（实时优化）
    poll_interval: 100ms               # 更频繁的轮询，提高实时性
    max_concurrent_files: 1024
    encoding: utf-8

    operators:
      - type: json_parser
        id: parse_json
        parse_from: body
        parse_to: attributes
      # 为VictoriaLogs创建_msg字段 - JSON解析后在attributes中
      - type: move
        from: attributes.msg
        to: attributes._msg
      # 清理不需要的重复字段
      - type: remove
        field: body

processors:
  batch:
    timeout: 500ms                     # 更短的批处理超时时间，提高实时性
    send_batch_size: 100              # 较小的批处理大小，快速发送
    send_batch_max_size: 200

exporters:
  file:
    path: "/var/log/otelcol/logs.json"
  
  # VictoriaLogs通过HTTP直接发送
  otlphttp/victorialogs:
    endpoint: "http://proj-victorialogs:9428/insert/opentelemetry"
    tls:
      insecure: true
    compression: gzip

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [filelog]
      processors: [batch]
      exporters: [file, otlphttp/victorialogs]
