# OpenTelemetry Collector Configuration for Docker Installation
# This configuration is designed for running in Docker containers with container networking

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327
      http:
        endpoint: 0.0.0.0:4328

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otelcol'
          scrape_interval: 10s
          static_configs:
            # In Docker, scrape metrics from itself
            - targets: ['0.0.0.0:8888']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    limit_mib: 512
    check_interval: 1s

exporters:
  logging:
    verbosity: detailed

  prometheus:
    endpoint: "0.0.0.0:8889"

  # Use OTLP exporter for traces (compatible with Jaeger)
  otlp/jaeger:
    endpoint: http://jaeger:14268/api/traces
    tls:
      insecure: true
    # Connection timeout and retry settings for container networking
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 60s
      max_elapsed_time: 10m

  # Optional: Log to stdout in Docker environment
  file:
    path: /var/log/otelcol/otelcol-output.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging, otlp/jaeger]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [logging, prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: 0.0.0.0:${PROJ_OTELCOL_HEALTH_PORT}