# MongoDB Configuration Template for Host Installation
# Environment variables will be substituted by envsubst

# mongod.conf

# for documentation of all options, see:
#   http://docs.mongodb.org/manual/reference/configuration-options/

# Where and how to store data.
storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true
    # Commit interval in milliseconds (default: 100ms)
    commitIntervalMs: 100
  # WiredTiger storage engine configuration
  wiredTiger:
    engineConfig:
      # Cache size (default: 50% of RAM - 1GB, minimum 256MB)
      cacheSizeGB: 1
      # Journal compression (default: snappy)
      journalCompressor: snappy
    collectionConfig:
      # Default compression for collections (default: snappy)
      blockCompressor: snappy
    indexConfig:
      # Index compression (default: prefix)
      prefixCompression: true

# Where to write logging data.
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: rename
  # Log level: 0=info, 1=debug, 2=detailed debug
  verbosity: 0
  component:
    accessControl:
      verbosity: 0
    command:
      verbosity: 0
    storage:
      verbosity: 0

# Network interfaces
net:
  port: ${PROJ_MONGO_PORT}
  bindIp: ${PROJ_MONGO_HOST}
  # Enable IPv6 support
  ipv6: false
  # Maximum simultaneous connections
  maxIncomingConnections: 65536
  # Socket options
  unixDomainSocket:
    enabled: true
    pathPrefix: /tmp
    filePermissions: 0700
  # TLS/SSL configuration (optional)
  #tls:
  #  mode: requireTLS
  #  certificateKeyFile: /etc/ssl/mongodb.pem
  #  CAFile: /etc/ssl/ca.pem

# Process management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
  pidFilePath: /var/lib/mongodb/mongod.lock
  fork: true

# Security settings
security:
  authorization: enabled
  # Authentication mechanisms
  # SCRAM-SHA-1, SCRAM-SHA-256, MONGODB-CR (deprecated)
  authenticationMechanisms:
    - SCRAM-SHA-1
    - SCRAM-SHA-256
  # JavaScript execution (disable for security in production)
  javascriptEnabled: true
  # LDAP configuration (optional)
  #ldap:
  #  servers: "ldap.example.com"
  #  bind:
  #    method: "simple"
  #    queryUser: "cn=admin,dc=example,dc=com"
  #    queryPassword: "secret"

# Operation profiling
operationProfiling:
  # Profiling level: 0=off, 1=slow ops, 2=all ops
  slowOpThresholdMs: 100
  mode: slowOp

# Replication (optional)
#replication:
#  # Replica set name
#  replSetName: "rs0"
#  # Oplog size in MB (default: 5% of disk space)
#  oplogSizeMB: 1024

# Sharding (optional)
#sharding:
#  # Cluster role: configsvr, shardsvr
#  clusterRole: shardsvr

# Enterprise-only options (commented out for community edition)
#auditLog:
#  destination: file
#  format: JSON
#  path: /var/log/mongodb/audit.log

#snmp:
#  subagent: true
#  master: true

# Cloud options (optional)
#cloud:
#  monitoring:
#    free:
#      state: "on"

# Free monitoring (MongoDB 4.0+)
cloud:
  monitoring:
    free:
      state: "off"

# Set parameter options
setParameter:
  # Cursor timeout in milliseconds (default: 600000 = 10 minutes)
  cursorTimeoutMillis: 600000
  # Failed authentication delay in milliseconds
  authenticationMechanismDelay: 100
  # Disable transparent huge pages
  transparentHugePageDefrag: false
  # Connection pool settings
  connPoolMaxShardedConnsPerHost: 200
  connPoolMaxConnsPerHost: 200
  # Indexing options
  maxIndexBuildMemoryUsageMegabytes: 200
  # Aggregation memory limit
  internalQueryExecMaxBlockingSortBytes: 33554432
  # WiredTiger settings
  wiredTigerConcurrentReadTransactions: 128
  wiredTigerConcurrentWriteTransactions: 128