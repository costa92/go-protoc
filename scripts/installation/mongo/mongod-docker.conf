# MongoDB Configuration Template for Docker Container Installation
# Environment variables will be substituted by envsubst

# mongod.conf for Docker containers

# for documentation of all options, see:
#   http://docs.mongodb.org/manual/reference/configuration-options/

# Where and how to store data.
storage:
  dbPath: /data/db
  journal:
    enabled: true
    # Shorter commit interval for containers
    commitIntervalMs: 100
  # WiredTiger storage engine configuration (container optimized)
  wiredTiger:
    engineConfig:
      # Smaller cache size for containers (default: 256MB)
      cacheSizeGB: 0.25
      # Journal compression
      journalCompressor: snappy
    collectionConfig:
      # Collection compression
      blockCompressor: snappy
    indexConfig:
      # Index compression
      prefixCompression: true

# Where to write logging data (container optimized)
systemLog:
  # Log to stdout for Docker log aggregation
  destination: file
  logAppend: true
  path: /proc/1/fd/1
  # Simplified logging for containers
  verbosity: 0
  component:
    accessControl:
      verbosity: 0

# Network interfaces (container settings)
net:
  port: 27017
  # Bind to all interfaces for container access
  bindIp: 0.0.0.0
  # Maximum simultaneous connections (container optimized)
  maxIncomingConnections: 1000
  # Socket options
  unixDomainSocket:
    enabled: false
  # Disable IPv6 for simplicity
  ipv6: false

# Process management (container settings)
processManagement:
  # Disable forking in containers
  fork: false
  timeZoneInfo: /usr/share/zoneinfo

# Security settings
security:
  authorization: enabled
  # Authentication mechanisms
  authenticationMechanisms:
    - SCRAM-SHA-1
    - SCRAM-SHA-256
  # JavaScript execution (enabled for development)
  javascriptEnabled: true

# Operation profiling (development settings)
operationProfiling:
  # Higher threshold for containers
  slowOpThresholdMs: 200
  mode: slowOp

# Disable free monitoring for containers
cloud:
  monitoring:
    free:
      state: "off"

# Set parameter options (container optimized)
setParameter:
  # Shorter cursor timeout for development
  cursorTimeoutMillis: 300000
  # Reduced authentication delay
  authenticationMechanismDelay: 50
  # Disable transparent huge pages
  transparentHugePageDefrag: false
  # Smaller connection pool for containers
  connPoolMaxShardedConnsPerHost: 50
  connPoolMaxConnsPerHost: 50
  # Reduced indexing memory
  maxIndexBuildMemoryUsageMegabytes: 100
  # Smaller aggregation memory limit
  internalQueryExecMaxBlockingSortBytes: 16777216
  # Reduced WiredTiger transactions for containers
  wiredTigerConcurrentReadTransactions: 64
  wiredTigerConcurrentWriteTransactions: 64