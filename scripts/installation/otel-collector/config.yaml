# OTEL Collector Configuration for Native Installation
# This configuration supports the full OTEL architecture with Agent -> Gateway -> SaaS pattern
# Optimized for native deployment on Linux systems

receivers:
  # File-based log collection (monitoring system log files)
  filelog:
    include:
      - /var/log/app/**/*.log                # Application logs
      - /var/log/apiserver/**/*.log          # API server logs
      - /var/log/**/*.json                   # JSON format logs
    exclude:
      - /var/log/otel-*                      # Exclude OTEL self-logs
      - /var/log/**/*test*                   # Exclude test logs

    start_at: end                            # Start from end for production
    include_file_name: true                  # Include file names
    include_file_path: true

    # File monitoring configuration
    poll_interval: 200ms                     # Standard polling interval
    max_concurrent_files: 512
    encoding: utf-8

    operators:
      - type: json_parser
        id: parse_json
        parse_from: body
        parse_to: attributes
      # Create _msg field for VictoriaLogs compatibility
      - type: move
        from: attributes.msg
        to: attributes._msg
      # Clean up duplicate fields
      - type: remove
        field: body

  # OTLP receivers for direct telemetry data
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317               # Standard OTLP gRPC port
      http:
        endpoint: 0.0.0.0:4318               # Standard OTLP HTTP port

  # Prometheus metrics scraping
  prometheus:
    config:
      scrape_configs:
        - job_name: 'apiserver'
          static_configs:
            - targets: ['localhost:8080']
          scrape_interval: 30s
          metrics_path: '/metrics'
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']
          scrape_interval: 30s
          metrics_path: '/metrics'

processors:
  # Batch processing
  batch:
    timeout: 1s                              # Standard timeout
    send_batch_size: 1000                    # Standard batch size
    send_batch_max_size: 1500

  # Resource attributes processing
  resource:
    attributes:
      - key: deployment.environment
        value: "${PROJ_ENVIRONMENT}"
        action: upsert
      - key: service.namespace
        value: "${PROJ_SERVICE_NAMESPACE}"
        action: upsert
      - key: deployment.type
        value: "native"
        action: upsert
      - key: otel.collector.version
        value: "${PROJ_OTELCOL_VERSION}"
        action: upsert

  # Memory limiter
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  # Sampling for traces
  probabilistic_sampler:
    sampling_percentage: 10

exporters:
  # Local file export
  file:
    path: "/var/log/otel/otel-export.json"
    rotation:
      max_megabytes: 100
      max_days: 7

  # VictoriaLogs
  otlphttp/victorialogs:
    endpoint: "http://127.0.0.1:9428/insert/opentelemetry"
    tls:
      insecure: true
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

  # Jaeger (using OTLP HTTP instead of deprecated jaeger exporter)
  otlphttp/jaeger:
    endpoint: "http://127.0.0.1:14268/api/traces"
    tls:
      insecure: true

  # Prometheus metrics export
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      environment: "${PROJ_ENVIRONMENT}"
      deployment: "native"

  # OTLP HTTP export to SaaS platforms (commented out by default)
  # Uncomment and configure when SaaS integration is needed
  # otlphttp/datadog:
  #   endpoint: "https://otlp.datadoghq.com"
  #   headers:
  #     DD-API-KEY: "${DD_API_KEY}"
  #   compression: gzip
  #   tls:
  #     insecure: false

  # otlphttp/newrelic:
  #   endpoint: "https://otlp.nr-data.net:4318"
  #   headers:
  #     api-key: "${NEW_RELIC_API_KEY}"
  #   compression: gzip
  #   tls:
  #     insecure: false

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance profiling
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]
  
  pipelines:
    # Logs pipeline with multiple export destinations
    logs:
      receivers: [filelog, otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [file, otlphttp/victorialogs]

    # Metrics pipeline  
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, probabilistic_sampler, batch]
      exporters: [otlphttp/jaeger]

  # Configure SaaS exports based on environment variables
  # Additional pipelines for SaaS (activated when API keys are provided)

  # Telemetry configuration
  telemetry:
    logs:
      level: info
      development: false
      sampling:
        initial: 5
        thereafter: 200
    metrics:
      level: basic