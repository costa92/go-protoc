# OTEL Collector Configuration for Docker Installation
# This configuration supports the full OTEL architecture with Agent -> Gateway -> SaaS pattern
# Optimized for containerized deployment with Docker networking

receivers:
  # File-based log collection (monitoring host log files via volume mounts)
  filelog:
    include:
      - /host/logs/**/*.log                  # Host log files (via volume mount)
      - /host/logs/**/*.json                 # JSON format logs
      - /host/logs/apiserver/app.log         # Specific application logs
      - /host/logs/saas-demo/saas.log        # SaaS demo logs  
      - /host/logs/agent-demo/agent.log      # Agent demo logs
      - /host/logs/complete-demo/complete.log # Complete demo logs
    exclude:
      - /host/logs/otel-*                    # Exclude OTEL self-logs
      - /host/logs/**/*test*                 # Exclude test logs

    start_at: end                            # Start from end for production
    include_file_name: false                 # Reduce noise in container environment
    include_file_path: false

    # File monitoring configuration (optimized for containers)
    poll_interval: 100ms                     # Fast polling for real-time processing
    max_concurrent_files: 1024
    encoding: utf-8

    operators:
      - type: json_parser
        id: parse_json
        parse_from: body
        parse_to: attributes
      # Create _msg field for VictoriaLogs compatibility
      - type: move
        from: attributes.msg
        to: attributes._msg
      # Clean up duplicate fields
      - type: remove
        field: body

  # OTLP receivers for direct telemetry data
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317               # Standard OTLP gRPC port
      http:
        endpoint: 0.0.0.0:4318               # Standard OTLP HTTP port

  # Prometheus metrics scraping (from host services)
  prometheus:
    config:
      scrape_configs:
        - job_name: 'apiserver'
          static_configs:
            # Use host.docker.internal for Docker Desktop or configure network properly
            - targets: ['host.docker.internal:8080']
          scrape_interval: 30s
          metrics_path: '/metrics'
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']
          scrape_interval: 30s
          metrics_path: '/metrics'

  # Note: Jaeger receiver removed as it's deprecated
  # Use OTLP receivers instead for trace collection

processors:
  # Batch processing (optimized for container environment)
  batch:
    timeout: 500ms                           # Shorter timeout for container responsiveness
    send_batch_size: 100                     # Smaller batch size
    send_batch_max_size: 200

  # Resource attributes processing
  resource:
    attributes:
      - key: deployment.environment
        value: "${PROJ_ENVIRONMENT}"
        action: upsert
      - key: service.namespace
        value: "${PROJ_SERVICE_NAMESPACE}"
        action: upsert
      - key: deployment.type
        value: "docker"
        action: upsert
      - key: otel.collector.version
        value: "${PROJ_OTELCOL_VERSION}"
        action: upsert
      - key: container.id
        from_attribute: container.id
        action: upsert

  # Memory limiter for container environments
  memory_limiter:
    check_interval: 1s
    limit_mib: 256                           # Smaller limit for containers

  # Sampling for traces
  probabilistic_sampler:
    sampling_percentage: 10

exporters:
  # VictoriaLogs (via Docker network)
  otlphttp/victorialogs:
    endpoint: "http://proj-victorialogs:9428/insert/opentelemetry"
    tls:
      insecure: true
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

  # Jaeger (via Docker network) - using OTLP HTTP instead of deprecated jaeger exporter
  otlphttp/jaeger:
    endpoint: "http://proj-jaeger:14268/api/traces"
    tls:
      insecure: true

  # Prometheus metrics export
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      environment: "${PROJ_ENVIRONMENT}"
      deployment: "docker"

  # OTLP HTTP export to SaaS platforms (commented out by default)
  # Uncomment and configure when SaaS integration is needed
  # otlphttp/datadog:
  #   endpoint: "https://otlp.datadoghq.com"
  #   headers:
  #     DD-API-KEY: "${DD_API_KEY}"
  #   compression: gzip
  #   tls:
  #     insecure: false

  # otlphttp/newrelic:
  #   endpoint: "https://otlp.nr-data.net:4318"
  #   headers:
  #     api-key: "${NEW_RELIC_API_KEY}"
  #   compression: gzip
  #   tls:
  #     insecure: false

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance profiling
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]
  
  pipelines:
    # Logs pipeline with multiple export destinations
    logs:
      receivers: [filelog, otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/victorialogs]

    # Metrics pipeline  
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, probabilistic_sampler, batch]
      exporters: [otlphttp/jaeger]

  # Configure SaaS exports based on environment variables
  # Additional pipelines for SaaS (activated when API keys are provided)

  # Telemetry configuration
  telemetry:
    logs:
      level: info
      development: false
      sampling:
        initial: 5
        thereafter: 200
    metrics:
      level: basic