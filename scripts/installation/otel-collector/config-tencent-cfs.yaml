# OTEL Collector Configuration for Tencent Cloud CFS Integration
# This configuration writes logs to Tencent Cloud CFS (Cloud File System) for persistent storage
# and supports both local file monitoring and OTLP protocol reception

receivers:
  # File-based log collection (monitoring local log files)
  filelog:
    include:
      - /opt/logs/**/*.log                       # Local application logs
      - /opt/logs/**/*.json                      # JSON format logs
      - /opt/logs/apiserver/app.log              # API server logs
      - /var/log/applications/**/*.log           # System application logs
    exclude:
      - /opt/logs/otel-*                         # Exclude OTEL self-logs
      - /opt/logs/**/*test*                      # Exclude test logs
      - /opt/logs/**/*.tmp                       # Exclude temporary files

    start_at: end                                # Start from end for production
    include_file_name: true                      # Include file info for CFS organization
    include_file_path: true
    include_file_name_resolved: true

    # Optimized polling for CFS performance
    poll_interval: 500ms                         # Slightly slower for network storage
    max_concurrent_files: 512                    # Reduced for network storage
    encoding: utf-8
    max_log_size: 1MiB                          # Limit individual log entry size

    operators:
      # Parse JSON logs
      - type: json_parser
        id: parse_json_logs
        parse_from: body
        parse_to: attributes
        if: 'body matches "^\\s*[{\\[]"'
      
      # Create _msg field for VictoriaLogs compatibility
      - type: move
        from: attributes.msg
        to: attributes._msg
        if: 'attributes.msg != nil'
      
      # Add file metadata for CFS organization
      - type: add
        field: attributes.file_source
        value: 'EXPR(attributes["log.file.path"])'
      
      # Add timestamp if missing
      - type: add
        field: attributes.collected_at
        value: 'EXPR(time.Now())'
      
      # Clean up body if JSON was parsed
      - type: remove
        field: body
        if: 'attributes != nil and len(attributes) > 0'

  # OTLP receivers for direct telemetry data
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size: 4194304               # 4MB for large log batches
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304           # 4MB for large log batches

processors:
  # Enhanced batch processing for CFS writes
  batch:
    timeout: 2s                                  # Longer timeout for network storage
    send_batch_size: 500                         # Larger batches for efficiency
    send_batch_max_size: 1000
    metadata_keys:
      - tenant_id
      - environment

  # Resource attributes with Tencent Cloud metadata
  resource:
    attributes:
      - key: cloud.provider
        value: "tencent"
        action: upsert
      - key: cloud.region
        value: "${TENCENT_REGION}"
        action: upsert
      - key: deployment.environment
        value: "${PROJ_ENVIRONMENT}"
        action: upsert
      - key: service.namespace
        value: "${PROJ_SERVICE_NAMESPACE}"
        action: upsert
      - key: cfs.mount_point
        value: "${CFS_MOUNT_POINT}"
        action: upsert
      - key: cfs.filesystem_id
        value: "${CFS_FILESYSTEM_ID}"
        action: upsert
      - key: otel.collector.version
        value: "${PROJ_OTELCOL_VERSION}"
        action: upsert

  # Memory limiter for CFS operations
  memory_limiter:
    check_interval: 2s
    limit_mib: 512                               # Higher limit for CFS buffering
    spike_limit_mib: 128

  # Transform logs for CFS organization
  transform/cfs_organization:
    log_statements:
      - context: log
        statements:
          # Add CFS-specific metadata
          - set(attributes["cfs.write_timestamp"], time.Now())
          - set(attributes["cfs.file_prefix"], Concat([attributes["service.name"], "_", attributes["deployment.environment"]]))
          
          # Organize by date for CFS directory structure
          - set(attributes["cfs.date_partition"], time.Now().Format("2006/01/02"))
          
          # Add file size estimation for CFS optimization
          - set(attributes["estimated_size"], Len(body))

exporters:
  # File exporter to Tencent Cloud CFS mount point
  file/cfs:
    path: "${CFS_MOUNT_POINT}/otel-logs/${CFS_DATE_PARTITION}/otel-collector-${CFS_INSTANCE_ID}.jsonl"
    rotation:
      max_megabytes: 100                         # 100MB per file for CFS efficiency
      max_days: 30                               # Keep 30 days on CFS
      max_backups: 100                           # Maximum backup files
      localtime: true

  # Alternative: Organized CFS structure by service and date
  file/cfs_organized:
    path: "${CFS_MOUNT_POINT}/logs/${PROJ_SERVICE_NAME}/${CFS_DATE_PARTITION}/app.jsonl"
    rotation:
      max_megabytes: 50                          # Smaller files for better CFS performance
      max_days: 90                               # Longer retention on CFS
      max_backups: 200
      localtime: true

  # VictoriaLogs for query capabilities (optional)
  otlphttp/victorialogs:
    endpoint: "http://proj-victorialogs:9428/insert/opentelemetry"
    tls:
      insecure: true
    compression: gzip
    timeout: 30s                                 # Longer timeout for network operations
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 60s
      max_elapsed_time: 10m

  # Console exporter for debugging (can be disabled in production)
  debug:
    verbosity: basic
    sampling_initial: 10
    sampling_thereafter: 100

  # Prometheus metrics for CFS monitoring
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      cfs_filesystem_id: "${CFS_FILESYSTEM_ID}"
      cfs_region: "${TENCENT_REGION}"
      environment: "${PROJ_ENVIRONMENT}"

extensions:
  # Health check
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/health"

  # Performance profiling
  pprof:
    endpoint: 0.0.0.0:1777

  # File storage for buffering during CFS unavailability
  file_storage/buffer:
    directory: /tmp/otel-buffer
    timeout: 10s

service:
  extensions: [health_check, pprof, file_storage/buffer]
  
  pipelines:
    # Primary logs pipeline to CFS
    logs/cfs:
      receivers: [filelog, otlp]
      processors: [memory_limiter, resource, transform/cfs_organization, batch]
      exporters: [file/cfs_organized]

    # Backup logs pipeline to VictoriaLogs (optional)
    logs/victorialogs:
      receivers: [filelog, otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/victorialogs]

    # Debug pipeline (disable in production)
    logs/debug:
      receivers: [otlp]
      processors: [memory_limiter, resource]
      exporters: [debug]

    # Metrics pipeline for monitoring CFS operations
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

  # Enhanced telemetry for CFS monitoring
  telemetry:
    logs:
      level: info
      development: false
      sampling:
        initial: 5
        thereafter: 200
      encoding: json
    metrics:
      level: detailed
      address: 0.0.0.0:8888

# Configuration Notes:
# 
# Required Environment Variables:
# - TENCENT_REGION: Tencent Cloud region (e.g., "ap-beijing")
# - CFS_MOUNT_POINT: CFS mount point path (e.g., "/mnt/cfs-logs")
# - CFS_FILESYSTEM_ID: Tencent Cloud CFS filesystem ID
# - CFS_DATE_PARTITION: Date partition for organization (auto-generated)
# - CFS_INSTANCE_ID: Unique instance identifier for this collector
# - PROJ_ENVIRONMENT: Environment name (development/staging/production)
# - PROJ_SERVICE_NAMESPACE: Service namespace
# - PROJ_SERVICE_NAME: Service name
# - PROJ_OTELCOL_VERSION: OpenTelemetry Collector version
#
# CFS Mount Commands (to be executed on host):
# sudo mkdir -p ${CFS_MOUNT_POINT}
# sudo mount -t nfs -o vers=4.0,proto=tcp ${CFS_IP}:/ ${CFS_MOUNT_POINT}
#
# Performance Considerations:
# - Use larger batch sizes for network efficiency
# - Configure appropriate file rotation for CFS limits
# - Monitor CFS bandwidth and IOPS limits
# - Consider compression for network transfer
# - Use buffering for CFS unavailability scenarios