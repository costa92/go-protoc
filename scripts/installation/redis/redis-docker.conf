# Redis Configuration Template for Docker Container Installation
# Environment variables will be substituted by envsubst

################################## NETWORK #####################################

# Accept connections on all interfaces for Docker
bind 0.0.0.0

# Default port
port 6379

# TCP listen() backlog.
tcp-backlog 511

# Close the connection after a client is idle for N seconds (0 to disable)
timeout 0

# TCP keepalive.
tcp-keepalive 300

################################# GENERAL #####################################

# Run as daemon in Docker
daemonize no

# Use stdout for logging in Docker (better for log aggregation)
supervised no

# No PID file needed in container
pidfile ""

# Logging
loglevel notice
logfile ""

# Enable system logger for Docker
syslog-enabled no

# Set the number of databases
databases 16

# Show logo
always-show-logo yes

################################ SNAPSHOTTING  ################################

# Save snapshots with more frequent saves for development
save 900 1
save 300 10
save 60 10000

# Background save error handling
stop-writes-on-bgsave-error yes

# Compression
rdbcompression yes
rdbchecksum yes

# Database file
dbfilename dump.rdb

# Remove RDB files used by replication
rdb-del-sync-files no

# Working directory (container internal)
dir /data

################################# REPLICATION #################################

# Replica configuration
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-diskless-load disabled
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 1mb
repl-backlog-ttl 3600
replica-priority 100
replica-ignore-maxmemory yes

################################## SECURITY ###################################

# No authentication by default for development
# requirepass ${REDIS_PASSWORD}

################################### CLIENTS ####################################

# Max clients for container environment  
maxclients 1000

############################## MEMORY MANAGEMENT #############################

# Memory policy optimized for development
maxmemory-policy allkeys-lru
maxmemory-samples 5
replica-ignore-maxmemory yes
active-expire-cycle-effort 1

############################# LAZY FREEING ####################################

lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no
lazyfree-lazy-user-del no
lazyfree-lazy-user-flush no

################################ THREADED I/O #################################

# Keep simple for containers
# io-threads 1
# io-threads-do-reads no

############################ KERNEL OOM CONTROL ##############################

# Disable OOM control for containers
oom-score-adj no

#################### KERNEL TRANSPARENT HUGEPAGE CONTROL ######################

# Disable transparent huge pages in container
disable-thp yes

############################## APPEND ONLY MODE ###############################

# Enable AOF for better durability in development
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

################################ LUA SCRIPTING  ###############################

# Lua timeout
lua-time-limit 5000

################################ REDIS CLUSTER  ###############################

# Cluster disabled by default
# cluster-enabled no

################################## SLOW LOG ###################################

# Slow log configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

################################ LATENCY MONITOR ##############################

# Latency monitoring
latency-monitor-threshold 0

############################# EVENT NOTIFICATION ##############################

# Key space notifications
notify-keyspace-events ""

############################### GOPHER SERVER #################################

# Gopher disabled
gopher-enabled no

############################### ADVANCED CONFIG ###############################

# Data structure optimizations
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits (conservative for containers)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Query buffer limit
client-query-buffer-limit 1gb

# Protocol limits
proto-max-bulk-len 512mb

# Background tasks frequency
hz 10

# Incremental fsync
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

########################### ACTIVE DEFRAGMENTATION #######################

# Disable active defragmentation for containers (optional)
# activedefrag no

# Jemalloc background thread
jemalloc-bg-thread yes

# CPU pinning disabled for containers
# server_cpulist
# bio_cpulist  
# aof_rewrite_cpulist
# bgsave_cpulist