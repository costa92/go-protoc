global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'victoria-metrics'
    static_configs:
      - targets: ['127.0.0.1:8428']
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'victoria-logs'
    static_configs:
      - targets: ['127.0.0.1:9428']
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'vmagent'
    static_configs:
      - targets: ['127.0.0.1:8429']
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'go-protoc-api'
    static_configs:
      - targets: ['127.0.0.1:8080']
    scrape_interval: 15s
    metrics_path: /metrics
