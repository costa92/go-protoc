global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'victoria-metrics'
    static_configs:
      - targets: ['proj-victoriametrics:8428']
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'victoria-logs'
    static_configs:
      - targets: ['proj-victorialogs:9428']
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'vmagent'
    static_configs:
      - targets: ['proj-vmagent:8429']
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'go-protoc-api'
    static_configs:
      - targets: ['host.docker.internal:8080']
    scrape_interval: 15s
    metrics_path: /metrics
