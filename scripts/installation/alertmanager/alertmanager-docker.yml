# AlertManager Configuration Template for Docker Container Installation
# Environment variables will be substituted by envsubst

global:
  # The smarthost and SMTP sender used for mail notifications.
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@example.org'
  smtp_auth_username: 'alertmanager@example.org'
  smtp_auth_password: 'password'
  
  # The default SMTP From header field.
  smtp_hello: 'localhost'
  
  # SMTP TLS requirement
  smtp_require_tls: false
  
  # Slack API URL.
  slack_api_url: ''
  
  # Global timeout for HTTP requests
  http_config:
    timeout: 30s
  
  # ResolveTimeout is the default value used by alertmanager if the alert does not include EndsAt.
  resolve_timeout: 5m

# The directory from which notification templates are read.
templates: 
  - '/etc/alertmanager/templates/*.tmpl'

# The root route on which each incoming alert enters.
route:
  # Group alerts by alertname and cluster
  group_by: ['alertname', 'cluster', 'service']

  # When a new group of alerts is created by an incoming alert, wait at
  # least 'group_wait' to send the initial notification.
  group_wait: 10s

  # When the first notification was sent, wait 'group_interval' to send a batch
  # of new alerts that started firing for that group.
  group_interval: 10s

  # If an alert has successfully been sent, wait 'repeat_interval' to resend them.
  repeat_interval: 1h

  # A default receiver
  receiver: 'web.hook'

  # Child routes
  routes:
    # Database service alerts
    - match_re:
        service: ^(mysql|mariadb|mongodb|redis)$
      receiver: database-alerts
      group_wait: 10s
      
    # Container service alerts
    - match_re:
        container: ^(${NETWORK_NAME}-.*)$
      receiver: container-alerts
      repeat_interval: 30m

    # Critical alerts bypass normal grouping
    - match:
        severity: critical
      receiver: critical-alerts
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 5m

    # High priority alerts
    - match:
        priority: high
      receiver: high-priority-alerts
      group_wait: 5s
      repeat_interval: 15m

# Inhibition rules
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'instance']

  # Container down inhibits service alerts
  - source_match:
      alertname: 'ContainerDown'
    target_match_re:
      alertname: '.*ServiceDown'
    equal: ['container']

receivers:
  # Default webhook receiver
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/webhook'
        send_resolved: true
        http_config:
          timeout: 10s
        max_alerts: 0
        title: 'AlertManager - {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}

  # Database alerts receiver  
  - name: 'database-alerts'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/database'
        send_resolved: true
        title: 'Database Alert - {{ .GroupLabels.service }}'
        text: |
          🗄️ Database Service: {{ .GroupLabels.service }}
          {{ range .Alerts }}
          Status: {{ .Status }}
          Summary: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}

  # Container alerts receiver
  - name: 'container-alerts'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/containers'
        send_resolved: true
        title: 'Container Alert - {{ .GroupLabels.container }}'
        text: |
          🐳 Container: {{ .GroupLabels.container }}
          Network: ${NETWORK_NAME}
          {{ range .Alerts }}
          Status: {{ .Status }}
          Issue: {{ .Annotations.summary }}
          Details: {{ .Annotations.description }}
          {{ end }}

  # Critical alerts receiver
  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/critical'
        send_resolved: true
        title: '🚨 CRITICAL ALERT - {{ .GroupLabels.alertname }} 🚨'
        text: |
          ⚠️ CRITICAL ISSUE DETECTED ⚠️
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Impact: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Severity: {{ .Labels.severity }}
          Time: {{ .StartsAt }}
          {{ end }}

  # High priority alerts receiver
  - name: 'high-priority-alerts'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/high-priority'
        send_resolved: true
        title: '⚡ High Priority Alert - {{ .GroupLabels.alertname }}'
        text: |
          🔥 High Priority Issue
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Service: {{ .Labels.service }}
          Container: {{ .Labels.container }}
          Priority: {{ .Labels.priority }}
          {{ end }}

  # Example: Slack integration for containers (uncomment to use)
  # - name: 'slack-alerts'
  #   slack_configs:
  #     - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
  #       channel: '#alerts'
  #       username: 'AlertManager'
  #       title: '{{ .GroupLabels.alertname }} - {{ .GroupLabels.service }}'
  #       text: |
  #         {{ range .Alerts }}
  #         *Alert:* {{ .Annotations.summary }}
  #         *Service:* {{ .Labels.service }}
  #         *Container:* {{ .Labels.container }}
  #         *Severity:* {{ .Labels.severity }}
  #         {{ end }}
  #       send_resolved: true

# Time intervals for Docker environment
time_intervals:
  # Development hours (extended for containerized environments)  
  - name: dev-hours
    time_intervals:
      - times:
          - start_time: '08:00'
            end_time: '20:00'
        weekdays: ['monday:friday']
        
  # Maintenance window
  - name: maintenance
    time_intervals:
      - times:
          - start_time: '02:00'
            end_time: '04:00'
        weekdays: ['saturday', 'sunday']