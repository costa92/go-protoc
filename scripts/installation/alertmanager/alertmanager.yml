# AlertManager Configuration Template for Host Installation
# Environment variables will be substituted by envsubst

global:
  # The smarthost and SMTP sender used for mail notifications.
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@example.org'
  smtp_auth_username: 'alertmanager@example.org'
  smtp_auth_password: 'password'
  
  # The default SMTP From header field.
  smtp_hello: 'localhost'
  
  # SMTP TLS requirement. Note that Go does not support unencrypted connections to remote SMTP endpoints.
  smtp_require_tls: false
  
  # Slack API URL.
  slack_api_url: ''
  
  # Global timeout for HTTP requests
  http_config:
    timeout: 30s
  
  # ResolveTimeout is the default value used by alertmanager if the alert does not include EndsAt.
  resolve_timeout: 5m

# The directory from which notification templates are read.
templates: 
  - '/etc/alertmanager/templates/*.tmpl'

# The root route on which each incoming alert enters.
route:
  # The labels by which incoming alerts are grouped together. For example,
  # multiple alerts coming in for cluster=A and alertname=LatencyHigh would
  # be batched into a single group.
  #
  # To aggregate by all possible labels use '...' as the sole label name.
  # This effectively disables aggregation entirely, passing through all
  # alerts as-is. This is unlikely to be what you want, unless you have
  # a very low alert volume or your upstream notification system performs
  # its own grouping. Example: group_by: [...]
  group_by: ['alertname', 'cluster', 'service']

  # When a new group of alerts is created by an incoming alert, wait at
  # least 'group_wait' to send the initial notification.
  # This way ensures that you get multiple alerts for the same group that start
  # firing shortly after another are batched together on the first
  # notification.
  group_wait: 10s

  # When the first notification was sent, wait 'group_interval' to send a batch
  # of new alerts that started firing for that group.
  group_interval: 10s

  # If an alert has successfully been sent, wait 'repeat_interval' to
  # resend them.
  repeat_interval: 1h

  # A default receiver
  receiver: 'web.hook'

  # All the above attributes are inherited by all child routes and can
  # overwritten on each.
  routes:
    # This routes performs a regular expression match on alert labels to
    # catch alerts that are related to a database.
    - match_re:
        service: ^(mysql|cassandra)$
      receiver: database-pager
      group_wait: 10s
      
    # This route handles all alerts coming from the development environment.
    - match:
        environment: development
      receiver: dev-notifications
      # Override the default repeat interval
      repeat_interval: 4h

    # Critical alerts bypass normal grouping
    - match:
        severity: critical
      receiver: critical-alerts
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 5m

# Inhibition rules allow to mute a set of alerts given that another alert is
# firing.
# We use this to mute any warning-level notifications if the same alert is
# already critical.
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    # Apply inhibition if the alertname is the same.
    # CAUTION: 
    #   If you have alerts with the same name but different label sets,
    #   this will inhibit alerts that you don't want to inhibit.
    equal: ['alertname', 'dev', 'instance']

  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'dev', 'instance']

receivers:
  # Default webhook receiver
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://127.0.0.1:5001/'
        send_resolved: true
        http_config:
          timeout: 10s
        max_alerts: 0

  # Database alerts receiver  
  - name: 'database-pager'
    webhook_configs:
      - url: 'http://127.0.0.1:5001/database'
        send_resolved: true
        title: 'Database Alert - {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: 'Database alert triggered: {{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  # Development environment alerts
  - name: 'dev-notifications'
    webhook_configs:
      - url: 'http://127.0.0.1:5001/dev'
        send_resolved: false
        title: 'Development Alert'

  # Critical alerts receiver
  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://127.0.0.1:5001/critical'
        send_resolved: true
        title: '🚨 CRITICAL ALERT 🚨'
        text: 'Critical alert: {{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}{{ end }}'

  # Email notifications (example - requires SMTP configuration)
  # - name: 'team-email'
  #   email_configs:
  #     - to: 'team@company.org'
  #       from: 'alertmanager@company.org'
  #       subject: 'AlertManager - {{ .GroupLabels.alertname }}'
  #       body: |
  #         {{ range .Alerts }}
  #         Alert: {{ .Annotations.summary }}
  #         Description: {{ .Annotations.description }}
  #         {{ end }}

  # Slack notifications (example)
  # - name: 'slack-notifications'
  #   slack_configs:
  #     - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
  #       channel: '#alerts'
  #       username: 'AlertManager'
  #       title: 'Alert - {{ .GroupLabels.alertname }}'
  #       text: 'Summary: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
  #       send_resolved: true

# Time intervals for routing
time_intervals:
  # Business hours: Monday to Friday, 9 AM to 5 PM
  - name: business-hours
    time_intervals:
      - times:
          - start_time: '09:00'
            end_time: '17:00'
        weekdays: ['monday:friday']
        
  # Weekend
  - name: weekend
    time_intervals:
      - weekdays: ['saturday', 'sunday']